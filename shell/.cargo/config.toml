# Cross-build for the Surface RT with build/shell/build.sh (it sets linker, CC and pkg-config by env).
# Host builds (nested dev runs) use the host target: cargo run --no-default-features --features winit -- --nested
[target.armv7-unknown-linux-gnueabihf]
rustflags = ["-C", "target-cpu=cortex-a9"]

[env]
PKG_CONFIG_ALLOW_CROSS = "1"
