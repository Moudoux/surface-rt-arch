# Read by mainline U-Boot (APX boot). Paths are relative to the root partition.
DEFAULT arch
TIMEOUT 30
MENU TITLE Surface RT

LABEL arch
    MENU LABEL Arch Linux ARM (7.0.1-surface-rt)
    LINUX /boot/zImage
    FDT /boot/dtbs/tegra30-microsoft-surface-rt.dtb
    APPEND root=PARTUUID=5352543a-0000-4000-8000-000000000001 rootwait rw console=ttyS0,115200n8 console=tty0 loglevel=4
