# /etc/tmpfiles.d/surface-rt-cpufreq.conf: ondemand reacts at 25% load and holds the raised clock for 10 samples
# (200 ms), so KWin's frame work runs at 1.4 GHz while windows move (default 95/1 left it at 620-1100 MHz: drops
# to ~51-57 FPS). Measured 2026-11-07. Remove this file to go back to the kernel defaults.
w /sys/devices/system/cpu/cpufreq/policy0/scaling_governor - - - - ondemand
w /sys/devices/system/cpu/cpufreq/ondemand/up_threshold - - - - 25
w /sys/devices/system/cpu/cpufreq/ondemand/sampling_down_factor - - - - 10
