# Surface RT (grate, Tegra 3): Qt Quick's subpixel distance-field text shaders are too long for the GPU's
# fragment program limit; grayscale antialiasing uses the short ones. Read by the systemd user manager, so
# every Plasma service (kwin, plasmashell, kscreenlocker, ...) and the apps they start get it.
QSG_DISTANCEFIELD_ANTIALIASING=gray
