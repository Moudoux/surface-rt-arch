# Surface RT: SDDM greeter on Wayland with our patched KWin (grate GLES 2.0) and plasma-keyboard as the
# touch keyboard. Owned by surface-rt-tools; local changes go in /etc/sddm.conf.d/20-local.conf.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QSG_DISTANCEFIELD_ANTIALIASING=gray
# the touch keyboard comes from KWin (--inputmethod), not Qt's in-process virtual keyboard
InputMethod=

[Wayland]
CompositorCommand=env QSG_DISTANCEFIELD_ANTIALIASING=gray kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1 --inputmethod plasma-keyboard

[Theme]
Current=breeze
