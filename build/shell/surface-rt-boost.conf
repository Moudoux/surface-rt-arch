# /etc/tmpfiles.d/surface-rt-boost.conf: let the video group raise the CPU and memory-controller clock floors.
# rtshell (shell/src/boost.rs) sets both floors to their maximum while the user touches/types and for 600 ms
# after (longer while an animation runs), then puts them back to the hardware minimum. Without this the first
# frame after a pause runs on idle clocks (~20 ms instead of ~7). Remove this file to undo (reboot).
z /sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq 0664 root video - -
z /sys/class/devfreq/6000c800.actmon/min_freq 0664 root video - -
